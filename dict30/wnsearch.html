<script>
var outputEl = document.getElementById('output');
var statusEl = document.getElementById('status');

var lines = [];       // stdout lines of the current run
var lastKey = null;   // key of the last completed run (null = app not run yet)
var ready = false;    // true once the runtime and the data package are loaded

// Content is replaced on every run, so let us restore the scroll position ourselves.
if ('scrollRestoration' in history) history.scrollRestoration = 'manual';

// The whole "wrapper". It must exist before wnsearch.js is loaded.
var Module = {
  noInitialRun: true,                                   // we call main() ourselves
  print: function (text) { lines.push(text); },         // app stdout
  printErr: function (text) { console.warn(text); },    // app stderr
  setStatus: function (text) { statusEl.textContent = text; },
  onAbort: function (what) { statusEl.textContent = 'Error: ' + what; },

  // Called after the wasm is instantiated AND the data package is unpacked.
  onRuntimeInitialized: function () {
    statusEl.textContent = '';
    ready = true;
    fromLocation();  // initial run: ?q=key#anchor from the URL, or no parameters
    focusInput();
  }
};

// One call of the app: argv[1] = key, or no arguments if key is omitted.
// Output is an HTML fragment, including the form, and replaces the old output.
function apprun(key) {
  lines = [];
  try {
    Module.callMain(key ? [key] : []);
    // Alternative, if the app exports a function instead of using main():
    //   (link with -sEXPORTED_FUNCTIONS=_process_input -sEXPORTED_RUNTIME_METHODS=ccall)
    //   lines = [Module.ccall('process_input', 'string', ['string'], [key])];
  } catch (e) {
    outputEl.textContent = 'Error: ' + e;
    return;
  }
  lastKey = key || '';
  outputEl.innerHTML = lines.join('\n');   // trusts the app to escape its own text
}

// The form exists only after apprun() has rendered the output, so it is looked
// up here at the time of use, never cached.
function focusInput() {
  var input = outputEl.querySelector('input[name="q"]');
  if (input) input.focus({ preventScroll: true });
}

function scrollToAnchor(anchor) {
  var el = null;
  if (anchor) {
    var v = CSS.escape(anchor);
    el = outputEl.querySelector('[id="' + v + '"],[name="' + v + '"]');
  }
  (el || outputEl).scrollIntoView();
}

// ---- URL <-> app state. The URL (?q=key#anchor) is the state; the browser's
// ---- history stack is the list of queries, so nothing else is stored.
function keyFromLocation() {
  return new URLSearchParams(location.search).get('q') || '';
}

function anchorFromLocation() {
  var h = location.hash.slice(1);
  try { return decodeURIComponent(h); } catch (e) { return h; }
}

function urlFor(key, anchor) {
  return location.pathname + (key ? '?q=' + encodeURIComponent(key) : '') +
         (anchor ? '#' + encodeURIComponent(anchor) : '');
}

// Show a state: run the app if the key changed (or if forced), then scroll.
// Does not touch the history.
function show(key, anchor, force) {
  if (force || key !== lastKey) apprun(key);
  scrollToAnchor(anchor);
}

// New user action: add a history entry (unless the URL is unchanged), then show it.
function go(key, anchor, force) {
  var url = urlFor(key, anchor);
  if (url !== location.pathname + location.search + location.hash) {
    try { history.pushState(null, '', url); } catch (e) { /* e.g. file:// */ }
  }
  show(key, anchor, force);
}

function fromLocation() {
  show(keyFromLocation(), anchorFromLocation(), false);
}

// Back/forward buttons (and same-page #anchor navigation) end up here.
window.addEventListener('popstate', function () {
  if (ready) fromLocation();
});

// The form is replaced on every run, so handlers are not attached to it.
// "submit" bubbles, so one listener on the output area serves every future form.
outputEl.addEventListener('submit', function (ev) {
  ev.preventDefault();
  var key = String(new FormData(ev.target).get('q') || '').trim();
  go(key, '', true);  // always re-run; empty key = run without parameters
  focusInput();
});

// Links in the output:
//   href="#anchor"         -> not handled here; the browser scrolls to it.
//   href="?q=key#anchor"   -> run the app with key, then scroll to #anchor (optional).
// Anything else (other pages, mailto:, ...) is left to the browser.
outputEl.addEventListener('click', function (ev) {
  var a = ev.target.closest('a');
  var href = a && a.getAttribute('href');
  if (!href || href.charAt(0) === '#') return;   // plain #anchor: the browser does it
  var u = new URL(href, location.href);
  if (u.origin !== location.origin || u.pathname !== location.pathname) return;
  var key = u.searchParams.get('q');
  if (!key) return;
  ev.preventDefault();
  var anchor = '';
  try { anchor = decodeURIComponent(u.hash.slice(1)); } catch (e) { anchor = u.hash.slice(1); }
  go(key, anchor, false);
});
